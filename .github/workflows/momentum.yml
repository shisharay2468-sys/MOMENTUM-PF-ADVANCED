name: Momentum run

on:
  schedule:
    # 12:30 UTC = 18:00 IST, after the NSE close
    - cron: "30 12 * * 1-5"
  workflow_dispatch:
    inputs:
      force_rebalance:
        description: "Force a rebalance regardless of the calendar"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: momentum
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        # All the system's files live inside the momentum-v2 folder
        working-directory: momentum-v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: momentum-v2/requirements.txt

      - run: pip install -r requirements.txt

      - name: Self-test on synthetic data
        run: python -m screener.run --offline-test

      - name: Run the screen
        run: |
          if [ "${{ inputs.force_rebalance }}" = "true" ]; then
            python -m screener.run --force-rebalance
          else
            python -m screener.run
          fi

      - name: Commit the day's output
        run: |
          git config user.name  "momentum-bot"
          git config user.email "momentum-bot@users.noreply.github.com"
          for p in docs state universe.csv catalysts.csv themes.csv exclude.csv; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          git diff --staged --quiet || git commit -m "Run $(date -u +%Y-%m-%d)"
          git push

      - name: Prepare dashboard for publishing
        uses: actions/upload-pages-artifact@v3
        with:
          path: momentum-v2/docs

      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
